<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fused app</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2023; --muted: #6b7078; --bg: #f6f7f8; --err: #c62828; --line: #d9dce1; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #131417; --err: #ff6b6b; --line: #2c2f35; } }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .state { max-width: 720px; margin: 0 auto; padding: 48px 24px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .err { color: var(--err); }
  pre { margin: 16px 0 0; padding: 12px; max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  a { color: inherit; }
</style>
</head>
<body>
<div class="state" id="state"><span class="muted">Opening app…</span></div>
<script>
  const FILE = __FILE_JSON__;
  const state = document.getElementById("state");

  const started = Date.now();
  function render(title, sub, log, isErr) {
    state.innerHTML = "";
    const h = document.createElement("h1"); h.textContent = title;
    if (!isErr && log) h.textContent += " · " + Math.round((Date.now() - started) / 1000) + "s";
    const p = document.createElement("div"); p.className = isErr ? "err" : "muted"; p.textContent = sub || "";
    state.append(h, p);
    if (log && log.length) {
      const pre = document.createElement("pre"); pre.textContent = log.join("\n"); state.append(pre);
      pre.scrollTop = pre.scrollHeight;
    }
    if (isErr) {
      const back = document.createElement("p"); back.innerHTML = '<a href="/">Open another app</a>'; state.append(back);
    }
  }

  function mount(view) {
    const frame = document.createElement("iframe");
    frame.src = view;
    frame.allow = "clipboard-read; clipboard-write; fullscreen; microphone; camera";
    document.title = window.__appName || "Fused app";
    state.remove();
    document.body.appendChild(frame);
  }

  async function poll(view) {
    for (;;) {
      let data;
      try {
        const res = await fetch("/api/open/status?file=" + encodeURIComponent(FILE));
        data = await res.json();
        if (!res.ok) return render("Could not open app", data.error, null, true);
      } catch (e) {
        return render("Could not open app", "Status request failed: " + e, null, true);
      }
      if (data.status === "done") return mount(view);
      if (data.status === "error") return render("Environment install failed", data.error, data.lines, true);
      render("Installing environment…", "Resolving and downloading the packages this app declares in its pyproject.toml.", data.lines);
      await new Promise((r) => setTimeout(r, 700));
    }
  }

  async function open() {
    if (!FILE) return render("Could not open app", "No .fused file given.", null, true);
    let res, data;
    try {
      res = await fetch("/api/open", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Fused": "1" },
        body: JSON.stringify({ file: FILE }),
      });
      data = await res.json();
    } catch (e) {
      return render("Could not open app", "Open request failed: " + e, null, true);
    }
    if (!res.ok) return render("Could not open app", data.error || "Not a valid .fused file.", null, true);
    window.__appName = data.name;
    if (data.install && data.install.status === "done") return mount(data.view);
    poll(data.view);
  }

  open();
</script>
</body>
</html>
