<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Render App</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1f2023; --muted: #6b7078; --bg: #f6f7f8; --card: #ffffff;
    --line: #d9dce1; --accent: #ebfd66; --accent-ink: #0d0d0f; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #131417; --card: #1b1d21; --line: #2c2f35; --err: #ff6b6b; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: minmax(0, 1fr); place-items: safe center; min-height: 100vh; padding: 24px;
    overflow-x: hidden;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  .zone {
    position: relative; width: min(560px, 100%); padding: 48px 32px; text-align: center; border-radius: 16px;
    background: color-mix(in srgb, var(--fg) 3%, var(--card));
    border: 2px dashed color-mix(in srgb, var(--fg) 22%, transparent);
    transition: border-color .15s, background-color .15s, box-shadow .15s, transform .15s;
  }
  .zone:hover { border-color: color-mix(in srgb, var(--fg) 32%, transparent); background: color-mix(in srgb, var(--fg) 5%, var(--card)); }
  .zone.over {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, var(--card));
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent);
    transform: scale(1.01);
  }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; }
  h1 code {
    font-size: 0.8em; font-weight: 500; padding: 2px 8px; margin: 0 2px; border-radius: 6px;
    background: color-mix(in srgb, var(--fg) 7%, transparent); border: 1px solid var(--line); vertical-align: 2px;
  }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  .or { margin: 22px 0 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  form { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 420px; margin: 0 auto; }
  input[type=text] {
    flex: 1 1 200px; min-width: 0; padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  input[type=text]::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
  button, label.pick {
    padding: 6px 12px; border-radius: 6px; font: inherit; font-size: 12px; font-weight: 500;
    background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  button:hover, label.pick:hover { color: var(--fg); border-color: color-mix(in srgb, var(--fg) 30%, transparent); }
  label.pick, form.has-text button[type=submit] { color: var(--fg); }
  input[type=file] { display: none; }
  .status { margin-top: 16px; min-height: 1.5em; font-size: 13px; color: var(--muted); }
  .status.err { color: var(--err); }
  /* Hovering a showcase card swaps the drop-zone copy for a mini preview card. */
  .zone .drop-copy { transition: opacity .15s; }
  .zone.peeking .drop-copy { opacity: 0; pointer-events: none; }
  .zone.peeking { border-color: transparent; background: transparent; box-shadow: none; }
  .peek {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .zone.peeking .peek { opacity: 1; }
  .peek .mini {
    width: min(336px, 100%); display: flex; flex-direction: column; gap: 8px; text-align: left;
    padding: 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 8px 28px rgba(0,0,0,.14);
  }
  .peek .mini .shot { aspect-ratio: 16 / 9; width: 100%; display: block; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; object-position: top; background: var(--bg); }
  .peek .mini .shot.blank { display: grid; place-items: center; font-size: 28px; color: var(--muted); }
  .peek .mini .shot[hidden] { display: none; }
  .peek .mini .title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .peek .mini .desc {
    font-size: 12px; line-height: 1.45; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .peek .mini .desc:empty { display: none; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 4px; }
  .brand .logo { width: 64px; height: 64px; flex: 0 0 auto; border-radius: 16px; background: #1b1d21; display: block; }
  .brand .name { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--fg); }
  .brand .name .app { color: var(--accent); }
  @media (max-width: 480px) {
    .brand { gap: 12px; }
    .brand .logo { width: 40px; height: 40px; border-radius: 10px; }
    .brand .name { font-size: 26px; }
  }
  .wrap { width: min(760px, 100%); min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; justify-items: center; }
  .showcase { width: 100%; min-width: 0; }
  .showcase[hidden] { display: none; }
  .showcase h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--fg); text-align: left; }
  .version { font-size: 11px; color: var(--muted); text-align: center; letter-spacing: .04em; display: flex; justify-content: center; align-items: center; }
  .version[hidden] { display: none; }
  .version a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .version a:hover { color: var(--fg); text-decoration: underline; }
  .version a svg { width: 12px; height: 12px; fill: currentColor; }
  .version .line { display: flex; align-items: center; gap: 6px; }
  /* Showcase: a horizontal rail of thumbnails pinned at the bottom. */
  .rail-wrap { position: relative; width: 100%; min-width: 0; }
  .rail {
    display: flex; gap: 9px; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity; scroll-behavior: smooth;
    padding: 4px 2px 10px; scrollbar-width: thin;
  }
  .rail.centered { justify-content: center; }
  .rail::-webkit-scrollbar { height: 6px; }
  .rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .card {
    flex: 0 0 150px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px;
    padding: 0; background: transparent; border: 0; color: var(--fg); font: inherit; cursor: pointer; text-align: left;
  }
  .card .shot {
    aspect-ratio: 16 / 10; width: 100%; display: block; border-radius: 10px; background: var(--card);
    border: 1px solid var(--line); object-fit: cover; object-position: top;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover .shot, .card:focus-visible .shot { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .card:focus-visible { outline: none; }
  .card .shot.blank { display: grid; place-items: center; font-size: 28px; color: var(--muted); }
  .card .title { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .rail-nav {
    position: absolute; top: 40%; transform: translateY(-50%); z-index: 1;
    width: 30px; height: 30px; padding: 0; display: none; align-items: center; justify-content: center;
    border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
    font-size: 18px; line-height: 1; font-weight: 400; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .rail-nav.show { display: flex; }
  .rail-nav:hover { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  #rail-prev { left: -12px; }
  #rail-next { right: -12px; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    .zone { padding: 32px 16px; }
    h1 { font-size: 18px; }
    .wrap { gap: 20px; }
    .card { flex-basis: 120px; }
    #rail-prev { left: -4px; }
    #rail-next { right: -4px; }
  }
</style>
</head>
<body>
<div class="wrap">
<header class="brand" aria-label="Render App">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#1b1d21"/>
    <path d="M32 10 C34 24 40 30 54 32 C40 34 34 40 32 54 C30 40 24 34 10 32 C24 30 30 24 32 10 Z" fill="#ebfd66"/>
    <circle cx="32" cy="32" r="5" fill="#1b1d21"/>
  </svg>
  <div class="name">Render <span class="app">App</span></div>
</header>
<div class="zone" id="zone">
  <div class="drop-copy">
    <h1>Drop a <code>.fused</code> app here</h1>
    <p>or double-click one in Finder, or paste its path.</p>
    <div class="or">or</div>
    <form id="form">
      <input type="text" id="path" placeholder="/absolute/path/to/app.fused" autocomplete="off" spellcheck="false" />
      <button type="submit">Open</button>
      <label class="pick">Choose file…<input type="file" id="file" accept=".fused" /></label>
    </form>
    <div class="status" id="status"></div>
  </div>
  <div class="peek" id="peek" role="tooltip" aria-hidden="true">
    <div class="mini">
      <img class="shot" id="peek-shot" alt="" hidden />
      <div class="shot blank" id="peek-blank" hidden>&#9635;</div>
      <div class="title" id="peek-title"></div>
      <div class="desc" id="peek-desc"></div>
    </div>
  </div>
</div>
<section class="showcase" id="showcase" hidden>
  <h2>Showcase</h2>
  <div class="rail-wrap">
    <button id="rail-prev" class="rail-nav" type="button" title="Previous" aria-label="Scroll showcase left">&#8249;</button>
    <div class="rail" id="rail"></div>
    <button id="rail-next" class="rail-nav" type="button" title="Next" aria-label="Scroll showcase right">&#8250;</button>
  </div>
</section>
<div class="version" id="version" hidden>
  <span class="line">
    <a href="https://github.com/fusedio/fused-render" target="_blank" rel="noopener" title="fused-render on GitHub" aria-label="fused-render on GitHub" class="gh"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
    <a id="version-label" href="https://github.com/fusedio/fused-render-app/releases" target="_blank" rel="noopener" title="Release notes"></a>
    <span aria-hidden="true">&middot;</span>
    <a href="https://render.fused.io/" target="_blank" rel="noopener" title="Fused Render"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill-rule="evenodd" d="M32 6 C34.5 23 41 29.5 58 32 C41 34.5 34.5 41 32 58 C29.5 41 23 34.5 6 32 C23 29.5 29.5 23 32 6 Z M32 27 a5 5 0 1 0 0 10 a5 5 0 1 0 0-10 Z"/></svg>Render</a>
  </span>
</div>
</div>
<script>
  const zone = document.getElementById("zone");
  const status = document.getElementById("status");
  const say = (msg, err) => { status.textContent = msg; status.className = "status" + (err ? " err" : ""); };

  function openPath(file) {
    location.href = "/open?_file=" + encodeURIComponent(file);
  }

  async function upload(file) {
    if (!file) return;
    if (!/\.fused$/i.test(file.name)) return say("Only .fused files can be opened here.", true);
    say("Uploading " + file.name + "…");
    try {
      const res = await fetch("/api/drop", {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream", "X-Fused": "1",
                   "X-Filename": encodeURIComponent(file.name) },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) return say(data.error || ("HTTP " + res.status), true);
      openPath(data.file);
    } catch (e) {
      say("Upload failed: " + e, true);
    }
  }

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const p = document.getElementById("path").value.trim();
    if (!p) return;
    if (!p.startsWith("/") && !/^[A-Za-z]:[\\/]/.test(p)) return say("Enter an absolute path.", true);
    openPath(p);
  });
  document.getElementById("file").addEventListener("change", (e) => upload(e.target.files[0]));
  const pathInput = document.getElementById("path");
  const syncHasText = () => document.getElementById("form").classList.toggle("has-text", pathInput.value.trim() !== "");
  pathInput.addEventListener("input", syncHasText);
  syncHasText();

  for (const ev of ["dragenter", "dragover"]) {
    document.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add("over"); });
  }
  for (const ev of ["dragleave", "drop"]) {
    document.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove("over"); });
  }
  document.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) upload(f);
  });

  // Mini preview: while a showcase card is hovered/focused the drop zone shows
  // the app's thumbnail, title and description instead of the drop copy.
  let peekTimer = null;
  function showPeek(ex) {
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => {
      const shot = document.getElementById("peek-shot");
      const blank = document.getElementById("peek-blank");
      if (ex.has_preview) {
        shot.src = "/api/showcase/preview?id=" + encodeURIComponent(ex.id);
        shot.hidden = false; blank.hidden = true;
      } else {
        shot.removeAttribute("src");
        shot.hidden = true; blank.hidden = false;
      }
      document.getElementById("peek-title").textContent = ex.title;
      document.getElementById("peek-desc").textContent = ex.description || "";
      document.getElementById("peek").setAttribute("aria-hidden", "false");
      zone.classList.add("peeking");
    }, 120);
  }
  function hidePeek() {
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => {
      zone.classList.remove("peeking");
      document.getElementById("peek").setAttribute("aria-hidden", "true");
    }, 150);
  }

  // Showcase apps packaged with the app (fused_render_app/showcase/). The
  // section stays hidden unless the server lists at least one.
  async function loadShowcase() {
    let rows;
    try {
      const res = await fetch("/api/showcase");
      if (!res.ok) return;
      rows = (await res.json()).showcase || [];
    } catch (e) {
      return;
    }
    if (!rows.length) return;
    const rail = document.getElementById("rail");
    for (const ex of rows) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.title = "Open " + ex.title;
      if (ex.has_preview) {
        const img = document.createElement("img");
        img.className = "shot";
        img.alt = "";
        img.loading = "lazy";
        img.src = "/api/showcase/preview?id=" + encodeURIComponent(ex.id);
        card.appendChild(img);
      } else {
        const blank = document.createElement("div");
        blank.className = "shot blank";
        blank.textContent = "\u25A3";
        card.appendChild(blank);
      }
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = ex.title;
      card.appendChild(title);
      card.addEventListener("click", () => openPath(ex.file));
      card.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") showPeek(ex); });
      card.addEventListener("pointerleave", hidePeek);
      card.addEventListener("focus", () => showPeek(ex));
      card.addEventListener("blur", hidePeek);
      rail.appendChild(card);
    }
    document.getElementById("showcase").hidden = false;
    rail.addEventListener("scroll", hidePeek, { passive: true });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") hidePeek(); });

    // Arrows only appear when the rail overflows; a rail that fits sits centred.
    const prev = document.getElementById("rail-prev");
    const next = document.getElementById("rail-next");
    const updateNav = () => {
      const over = rail.scrollWidth - rail.clientWidth - 1;
      prev.classList.toggle("show", rail.scrollLeft > 4);
      next.classList.toggle("show", over > 0 && rail.scrollLeft < over);
      rail.classList.toggle("centered", over <= 0);
    };
    const nudge = (dir) => rail.scrollBy({ left: dir * rail.clientWidth * 0.8, behavior: "smooth" });
    prev.addEventListener("click", () => nudge(-1));
    next.addEventListener("click", () => nudge(1));
    rail.addEventListener("scroll", updateNav, { passive: true });
    rail.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault();
      rail.scrollLeft += e.deltaY;
    }, { passive: false });
    window.addEventListener("resize", updateNav);
    updateNav();
    requestAnimationFrame(updateNav);
  }
  loadShowcase();

  // Version footer, from the server so it can never drift from __version__.
  fetch("/api/health").then(r => r.ok ? r.json() : null).then(h => {
    if (h && h.version) {
      document.getElementById("version-label").textContent = "Render App v" + h.version;
      document.getElementById("version").hidden = false;
    }
  }).catch(() => {});
</script>
</body>
</html>
