<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f8; --fg: #1f2023; --muted: #6b7078; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131417; --fg: #e8eaed; --muted: #9aa0a6; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #note { padding: 24px; color: var(--muted); }
</style>
</head>
<body>
<div id="note" hidden></div>
<script>
  // The chat host. Like /open for an app: this page's address carries the
  // chat's params (`_file`, `session_id`, `run`, `model`, `effort`, `split`,
  // …) — runtime.js in the iframe below reads and writes them on the topmost
  // same-origin window, which is this one — and the iframe renders
  // fused-render's chat template (templates/claude/template.html) through
  // /render, which injects runtime.js. `_file` is the folder the
  // conversation is about: an extracted .fused app, or any folder.
  const TEMPLATE = __TEMPLATE_JSON__;
  const FILE = __FILE_JSON__;
  // Framed (the Tasks page's peek): runtime.js would climb past this page to
  // the outer document's URL for its params and lose `session_id`; the
  // boundary keeps the chat's params on the chat's own frame.
  if (window !== window.top) window._fusedParamBoundary = true;
  // The ask-Claude hop (runtime.js `_fusedAskClaude` / `_fusedTakeClaudeAsk`):
  // a prompt handed to this host — by a framed page calling up, or stashed in
  // sessionStorage by the page that opened this window — is held in memory
  // and collected ONCE by the chat template at its boot.
  let pendingAsk = null;
  try {
    const key = "fused:ask:" + FILE;
    pendingAsk = sessionStorage.getItem(key);
    sessionStorage.removeItem(key);
  } catch (e) { /* storage unavailable: no ask */ }
  window._fusedClaudeAsk = (text) => { pendingAsk = text || null; return !!pendingAsk; };
  window._fusedClaudeAskTake = () => { const v = pendingAsk; pendingAsk = null; return v; };
  const q = new URLSearchParams(location.search);
  q.set("path", TEMPLATE);
  q.set("_file", FILE);
  const frame = document.createElement("iframe");
  frame.allow = "clipboard-read; clipboard-write; fullscreen; microphone; camera";
  frame.src = "/render?" + q.toString();
  document.body.appendChild(frame);
  const base = FILE.split("/").filter(Boolean).pop() || FILE;
  document.title = "Chat — " + base;
</script>
</body>
</html>
