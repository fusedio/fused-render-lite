<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FusedBot</title>
  <link rel="icon" type="image/png" href="/static/fusedbot-icon-64.png" />
  <!-- Pre-paint theme bootstrap: the same key and resolution rule as lite.html (and lib/theme.ts, static/runtime.js),
       so the resolved appearance is on <html> before the first paint. Separate try blocks: a throwing localStorage
       (private mode) must still fall through to the OS preference. -->
  <script>
    (function () {
      var pref = null;
      try {
        pref = localStorage.getItem("fused-render:theme");
      } catch (e) {
        /* private mode / blocked storage — fall through to the OS preference */
      }
      var theme;
      if (pref === "light" || pref === "dark") {
        theme = pref;
      }
      if (!theme) {
        try {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {
          theme = "dark";
        }
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <!-- First-paint ground until the bundle's CSS lands: OpenBot's --bg for each theme. -->
  <style>
    html { color-scheme: dark; background: #000000; }
    html[data-theme="light"] { color-scheme: light; background: #fcfcfc; }
    body { margin: 0; background: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/bots.tsx"></script>
</body>
</html>
