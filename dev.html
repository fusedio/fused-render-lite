<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>FusedBot dev</title>
<!--
  Open this file in a browser (file:// is fine) and it shows the dev server
  full-window the moment it answers, then keeps showing it across the
  reload-on-edit restarts scripts/dev.sh does.

    open dev.html                 # dev.sh's port on main (2778)
    open "dev.html?port=2995"     # any other port (dev.sh prints the branch's)

  Until the server is up the page polls /api/health once a second and says
  which port it is waiting on; the port can be changed in place. Nothing here
  is served by the app — it is a bookmarkable window onto whatever is running.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #wait[hidden] { display: none; }
  #wait .box { text-align: center; color: #8e8e93; }
  #wait .box b { display: block; color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  #wait code { color: #eafe68; }
  #wait form { margin-top: 18px; display: inline-flex; gap: 8px; align-items: center; }
  #wait input { width: 6em; padding: 6px 8px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; font: inherit; }
  #wait button { padding: 6px 12px; border-radius: 999px; border: 0; background: #2c2c2e; color: #fff; font: inherit; cursor: pointer; }
  #wait .hint { margin-top: 14px; font-size: 12px; }
  #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ffb020; margin-right: 6px; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
  <iframe id="app" title="FusedBot dev server"></iframe>
  <div id="wait">
    <div class="box">
      <b><span id="dot"></span>Waiting for the dev server</b>
      <div>Nothing answers on <code id="where">127.0.0.1:2778</code> yet.</div>
      <form id="portform">
        <label>port <input id="port" type="number" min="1" max="65535" /></label>
        <button type="submit">Use</button>
      </form>
      <div class="hint">Start it with <code>scripts/dev.sh</code> (it prints the branch's port), or <code>?port=&lt;n&gt;</code> on this page.</div>
    </div>
  </div>
  <script>
    const DEFAULT_PORT = 2778; // scripts/dev.sh on main; other branches get 2779 + crc32(branch) % 1000
    const params = new URLSearchParams(location.search);
    let port = Number(params.get("port")) || Number(localStorage.getItem("fusedbot-dev-port")) || DEFAULT_PORT;
    const frame = document.getElementById("app");
    const wait = document.getElementById("wait");
    const where = document.getElementById("where");
    const input = document.getElementById("port");
    let shown = false;
    let timer = null;

    const origin = () => `http://127.0.0.1:${port}`;

    function setPort(p) {
      port = p;
      localStorage.setItem("fusedbot-dev-port", String(p));
      where.textContent = `127.0.0.1:${p}`;
      input.value = String(p);
      shown = false;
      wait.hidden = false;
      frame.removeAttribute("src");
      const u = new URL(location.href);
      u.searchParams.set("port", String(p));
      history.replaceState(null, "", u);
      poll();
    }

    // `no-cors`: a file:// page cannot read a loopback response, but the
    // fetch still resolves (opaque) when something answers and rejects when
    // the connection is refused — which is the only fact needed here.
    async function up() {
      try {
        await fetch(`${origin()}/api/health?t=${Date.now()}`, { mode: "no-cors", cache: "no-store" });
        return true;
      } catch {
        return false;
      }
    }

    async function poll() {
      clearTimeout(timer);
      const ok = await up();
      if (ok && !shown) {
        // Load the front door exactly as a fresh tab would: `/` so a
        // never-seen home lands on the setup wizard.
        frame.src = `${origin()}/`;
        wait.hidden = true;
        shown = true;
      } else if (!ok && shown) {
        // dev.sh restarting on an edit: show the wait screen, reload when back.
        wait.hidden = false;
        shown = false;
      }
      timer = setTimeout(poll, ok ? 2000 : 1000);
    }

    document.getElementById("portform").addEventListener("submit", (e) => {
      e.preventDefault();
      const p = Number(input.value);
      if (p >= 1 && p <= 65535) setPort(p);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "r" && (e.metaKey || e.ctrlKey) && shown) {
        e.preventDefault();
        frame.src = frame.src; // reload the app, not this page
      }
    });

    where.textContent = `127.0.0.1:${port}`;
    input.value = String(port);
    poll();
  </script>
</body>
</html>
