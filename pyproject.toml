[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fused-render-app"
dynamic = ["version"]
description = "Opens .fused single-file apps. Nothing else."
readme = "README.md"
requires-python = ">=3.11"
# Zero runtime dependencies: the server is http.server, the .fused format is
# zlib + json, app environments are built by uv on demand. Every megabyte
# in the DMG has to earn its place.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# The macOS shell (macapp.py + mainwindow.py). Only the packaged .app installs it.
app = [
    "rumps",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    # The app's windows are WKWebViews (mainwindow.py).
    "pyobjc-framework-WebKit; sys_platform == 'darwin'",
    # fused.capture (capture/_darwin.py): native screen + mic recording and
    # stills. Quartz, CoreMedia and CoreAudio arrive as their transitives.
    "pyobjc-framework-ScreenCaptureKit; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
]

[project.scripts]
fused-render-app = "fused_render_app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "fused_render_app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fused_render_app"]
