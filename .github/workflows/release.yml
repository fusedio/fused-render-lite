name: release

# Mirrors fusedio/fused-render's release.yml, macOS job only (no update
# manifest or Windows/Linux builds). Same shape: prepare-release creates the
# GitHub Release, the macOS job builds, signs, notarizes and staples the DMG on
# an ephemeral keychain, uploads it to the fused-render S3 bucket (served via
# the same CloudFront distribution as the main app, under render-app-dmgs/)
# and attaches it to the Release; bump-homebrew then points the
# fusedio/homebrew-tap cask at the CDN copy.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created at the current commit if it doesn't exist yet). To rebuild an existing tag run with --ref <tag>."
        required: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # previous-tag lookup needs all tags

      - name: Resolve release tag
        id: resolve
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            RUN_SHA="$(git rev-parse "${{ github.sha }}^{commit}")"
            if [ "$TAG_SHA" != "$RUN_SHA" ]; then
              echo "::error::tag $TAG points at $TAG_SHA but this run builds $RUN_SHA — refusing to publish mismatched artifacts"
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
            exit 0
          fi
          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)"
          gh release create "$TAG" --target "${{ github.sha }}" \
            --title "RenderApp $TAG" \
            --generate-notes ${PREV_TAG:+--notes-start-tag "$PREV_TAG"}

  build-sign-notarize-release:
    needs: prepare-release
    # macos-26: build_dmg.sh compiles the apple tier helper against the macOS 26
    # SDK, and setup-python installs the python.org-style framework 3.12 that
    # py2app bundles (an old deployment target, so the DMG runs on older macOS).
    runs-on: macos-26
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
      dmg_sha256: ${{ steps.artifacts.outputs.dmg_sha256 }}
      dmg_url: ${{ steps.artifacts.outputs.dmg_url }}
      cdn_host: ${{ steps.artifacts.outputs.cdn_host }}
    permissions:
      contents: write # needed to attach the DMG to the GitHub Release
      id-token: write # needed to assume the AWS role via OIDC
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      KEYCHAIN_PATH: ${{ github.workspace }}/ci-signing.keychain-db
      NOTARY_PROFILE: ci-notary
      AWS_DEFAULT_REGION: us-west-2
      # Same bucket + CloudFront distribution as fused-render, but the role
      # (github_render_app_role) can only write
      # under S3_PREFIX — never the main app's dmgs, latest.json or download
      # page. Flip CDN_DOMAIN to render.fused.io together with fused-render;
      # the cask's `verified:` host follows it.
      S3_BUCKET: fused-render
      S3_PREFIX: render-app-dmgs
      CDN_DOMAIN: d2ic19jpchjovp.cloudfront.net
      CLOUDFRONT_DISTRIBUTION_ID: E393B7TS7Y3EDS
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select an Xcode with the macOS 26 SDK (apple tier helper)
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$XCODE" ]]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      # build_dmg.sh copies the host's uv INTO the bundle: the app ships no
      # venv/ensurepip/pip, so every environment it builds is `uv sync`.
      - uses: astral-sh/setup-uv@v9.0.0

      # Requires the repo secrets CODESIGN_CERT_P12 (base64 .p12),
      # CODESIGN_CERT_PASSWORD, CODESIGN_IDENTITY (SHA-1 of the Developer ID
      # Application cert), KEYCHAIN_PASSWORD, NOTARY_API_KEY_P8, NOTARY_API_KEY_ID,
      # NOTARY_API_ISSUER_ID. Without them the build is ad-hoc signed and not
      # notarized (Render App-only fallback; main requires them).
      - name: Import signing cert + notary credentials into ephemeral keychain
        env:
          CODESIGN_CERT_P12: ${{ secrets.CODESIGN_CERT_P12 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CODESIGN_CERT_P12:-}" ]; then
            echo "no signing secrets configured -> ad-hoc build"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/codesign-cert.p12"
          echo "$CODESIGN_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 14400 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CODESIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          API_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$NOTARY_API_KEY_P8" > "$API_KEY_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$API_KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$API_KEY_PATH"

          rm -f "$CERT_PATH"
          echo "FUSED_RENDER_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "FUSED_RENDER_NOTARY_PROFILE=$NOTARY_PROFILE" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple DMG
        env:
          FUSED_RENDER_CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: bash scripts/build_dmg.sh

      - name: Delete ephemeral keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Verify notarization ticket
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -1)"
          if [ -n "${FUSED_RENDER_NOTARY_PROFILE:-}" ]; then
            xcrun stapler validate "$DMG"
            spctl -a -t open --context context:primary-signature -v "$DMG"
          else
            echo "not notarized (no signing secrets) — ad-hoc build"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::926411091187:role/github_render_app_role
          role-session-name: GithubRenderAppRelease
          aws-region: us-west-2

      - name: Upload DMG to S3
        id: artifacts
        run: |
          set -euo pipefail
          # Not `brew install awscli`: GH's macOS images don't have the
          # `aws/tap` cask pre-trusted, and Homebrew's tap-trust gate fails
          # the install outright. Apple's own .pkg installer sidesteps
          # Homebrew (and its taps) entirely.
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "$RUNNER_TEMP/AWSCLIV2.pkg"
            sudo installer -pkg "$RUNNER_TEMP/AWSCLIV2.pkg" -target /
          fi
          DMG_PATH="$(ls dist/*.dmg)"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          # DMG only: the role's PutObject is scoped to ${S3_PREFIX}/*, so the
          # wheel stays a GitHub Release asset (uploaded below).
          aws s3 cp "$DMG_PATH" "s3://${S3_BUCKET}/${S3_PREFIX}/$(basename "$DMG_PATH")"
          # Exposed as job outputs for the split-out bump-homebrew job. Written
          # only after the S3 upload succeeds, so the cask never points at a
          # DMG that never made it onto the CDN. Version + hash come from the
          # DMG that was actually built, not from the git tag.
          echo "version=$(basename "$DMG_PATH" .dmg | sed 's/^RenderApp-//')" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg_url=https://${CDN_DOMAIN}/${S3_PREFIX}/$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"
          echo "cdn_host=${CDN_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront
        # Filenames are versioned, so this only matters when an existing tag
        # is rebuilt (workflow_dispatch --ref <tag>) and the object replaced.
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/${S3_PREFIX}/*"

      - name: Upload DMG + wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH" dist/*.whl --clobber

  bump-homebrew:
    # Separate job so a tap-push failure can't fail the DMG job after the
    # Release already published.
    needs: build-sign-notarize-release
    runs-on: ubuntu-latest
    permissions: {} # uses the tap PAT only; no GITHUB_TOKEN scopes needed
    steps:
      - name: Bump homebrew-tap cask
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          # From the DMG that was actually built+hashed, not the git tag.
          VERSION: ${{ needs.build-sign-notarize-release.outputs.version }}
          DMG_SHA256: ${{ needs.build-sign-notarize-release.outputs.dmg_sha256 }}
          # CloudFront host the DMG was published under (CDN_DOMAIN of the
          # build job), so the cask `url`/`verified:` can never drift from it.
          CDN_HOST: ${{ needs.build-sign-notarize-release.outputs.cdn_host }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/fusedio/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          # Write the whole cask instead of sed-ing version/sha256: the DMG and
          # .app names (RenderApp-*.dmg, RenderApp.app) live here too, so a
          # rename ships atomically with the first release built under the new
          # name. The cask token is render-app. The download comes from the
          # CDN (same as fused-render's cask); `verified:` is required because
          # the host differs from the homepage. livecheck keeps using GitHub
          # Releases (still published, with the same DMG attached) — the
          # :github_latest strategy only understands github.com URLs, so it
          # can't be pointed at the CDN `url`.
          cat > Casks/render-app.rb <<CASK
          cask "render-app" do
            version "${VERSION}"
            sha256 "${DMG_SHA256}"

            url "https://${CDN_HOST}/render-app-dmgs/RenderApp-#{version}.dmg",
                verified: "${CDN_HOST}/render-app-dmgs/"
            name "Render App"
            desc "Lightweight runtime for .fused apps: Python-powered interactive HTML views"
            homepage "https://github.com/fusedio/fused-render-lite"

            livecheck do
              url "https://github.com/fusedio/fused-render-lite/releases/latest"
              strategy :github_latest
            end

            depends_on macos: :monterey

            app "RenderApp.app"

            uninstall quit: "io.fused.render.app"
          end
          CASK
          git config user.name "fused-render-app-ci"
          git config user.email "ci@fused.io"
          git add Casks/render-app.rb
          git commit -m "render-app ${VERSION}"
          git push origin main
