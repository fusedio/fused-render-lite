name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # for dorny/paths-filter on pull_request

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos_packaging: ${{ steps.filter.outputs.macos_packaging }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            macos_packaging:
              - 'scripts/build_dmg.sh'
              - 'scripts/setup_py2app.py'
              - 'scripts/app_entry.py'
              - 'scripts/build_apple_helper.sh'
              - 'fused_render_app/ai/apple/helper/**'
              - 'pyproject.toml'
              - '.github/workflows/test.yml'

  # The suite is platform-neutral (native bits are monkeypatched), so it runs
  # on the cheap runner; macos-desktop below is the native check.
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@v9.0.0
      # [fused] so tests/test_engine.py runs the fused engine, not just skips.
      - run: pip install -e ".[dev,fused]"
      - run: pytest -q

  # The same smoke build fused-render's macos-desktop job runs: build_dmg.sh
  # end to end, ad-hoc signed (no identity configured), every bundle probe on.
  macos-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.macos_packaging == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select an Xcode with the macOS 26 SDK (apple tier helper)
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$XCODE" ]]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Build the DMG (smoke)
        run: bash scripts/build_dmg.sh

  test-status:
    name: Test Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, test-python, macos-desktop]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.test-python.result }}" != "success" ]]; then
            echo "test-python: ${{ needs.test-python.result }}"; exit 1
          fi
          case "${{ needs.macos-desktop.result }}" in success|skipped) ;; *) echo "macos-desktop: ${{ needs.macos-desktop.result }}"; exit 1 ;; esac
          echo "Tests passed"
