<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fused-render-lite</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1f2023; --muted: #6b7078; --bg: #f6f7f8; --card: #ffffff;
    --line: #d9dce1; --accent: #b7f000; --accent-ink: #1a2400; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #131417; --card: #1b1d21; --line: #2c2f35; --err: #ff6b6b; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  .zone {
    width: min(560px, 100%); padding: 48px 32px; text-align: center; border-radius: 16px;
    background: var(--card); border: 2px dashed var(--line); transition: border-color .15s, background .15s;
  }
  .zone.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  .or { margin: 22px 0 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 260px; min-width: 0; padding: 10px 12px; border-radius: 8px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button, label.pick {
    padding: 10px 16px; border-radius: 8px; border: 0; font: inherit; font-size: 14px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  label.pick { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  input[type=file] { display: none; }
  .status { margin-top: 16px; min-height: 1.5em; font-size: 13px; color: var(--muted); }
  .status.err { color: var(--err); }
  .foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .wrap { width: min(760px, 100%); display: grid; gap: 28px; justify-items: center; }
  .showcase { width: 100%; }
  .showcase[hidden] { display: none; }
  .showcase h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; }
  .showcase p.lead { margin: 0 0 16px; text-align: center; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); color: var(--fg); font: inherit; cursor: pointer;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.08); outline: none; }
  .card .shot { aspect-ratio: 16 / 10; width: 100%; background: var(--bg); object-fit: cover; object-position: top; display: block; border-bottom: 1px solid var(--line); }
  .card .shot.blank { display: grid; place-items: center; font-size: 32px; color: var(--muted); }
  .card .body { padding: 12px 14px 14px; display: grid; gap: 4px; }
  .card .title { font-weight: 600; font-size: 14px; }
  .card .desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .card .open { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--accent-ink); background: var(--accent); padding: 4px 10px; border-radius: 6px; justify-self: start; }
</style>
</head>
<body>
<div class="wrap">
<div class="zone" id="zone">
  <h1>Drop a <code>.fused</code> app here</h1>
  <p>or double-click one in Finder, or paste its path.</p>
  <div class="or">or</div>
  <form id="form">
    <input type="text" id="path" placeholder="/absolute/path/to/app.fused" autocomplete="off" spellcheck="false" />
    <button type="submit">Open</button>
    <label class="pick">Choose file…<input type="file" id="file" accept=".fused" /></label>
  </form>
  <div class="status" id="status"></div>
  <div class="foot">fused-render-lite only opens <code>.fused</code> apps. Supported API: runPython, params, readFile, stat, writeFile, rawUrl.</div>
</div>
<section class="showcase" id="showcase" hidden>
  <h2>Or start from a showcase app</h2>
  <p class="lead">Apps that ship with fused-render-lite. Click one to open it.</p>
  <div class="cards" id="cards"></div>
</section>
</div>
<script>
  const zone = document.getElementById("zone");
  const status = document.getElementById("status");
  const say = (msg, err) => { status.textContent = msg; status.className = "status" + (err ? " err" : ""); };

  function openPath(file) {
    location.href = "/open?_file=" + encodeURIComponent(file);
  }

  async function upload(file) {
    if (!file) return;
    if (!/\.fused$/i.test(file.name)) return say("Only .fused files can be opened here.", true);
    say("Uploading " + file.name + "…");
    try {
      const res = await fetch("/api/drop", {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream", "X-Fused": "1",
                   "X-Filename": encodeURIComponent(file.name) },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) return say(data.error || ("HTTP " + res.status), true);
      openPath(data.file);
    } catch (e) {
      say("Upload failed: " + e, true);
    }
  }

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const p = document.getElementById("path").value.trim();
    if (!p) return;
    if (!p.startsWith("/") && !/^[A-Za-z]:[\\/]/.test(p)) return say("Enter an absolute path.", true);
    openPath(p);
  });
  document.getElementById("file").addEventListener("change", (e) => upload(e.target.files[0]));

  for (const ev of ["dragenter", "dragover"]) {
    document.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add("over"); });
  }
  for (const ev of ["dragleave", "drop"]) {
    document.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove("over"); });
  }
  document.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) upload(f);
  });

  // Showcase apps packaged with the app (fused_render_lite/showcase/). The
  // section stays hidden unless the server lists at least one.
  async function loadShowcase() {
    let rows;
    try {
      const res = await fetch("/api/showcase");
      if (!res.ok) return;
      rows = (await res.json()).showcase || [];
    } catch (e) {
      return;
    }
    if (!rows.length) return;
    const cards = document.getElementById("cards");
    for (const ex of rows) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.title = "Open " + ex.title;
      if (ex.has_preview) {
        const img = document.createElement("img");
        img.className = "shot";
        img.alt = "";
        img.loading = "lazy";
        img.src = "/api/showcase/preview?id=" + encodeURIComponent(ex.id);
        card.appendChild(img);
      } else {
        const blank = document.createElement("div");
        blank.className = "shot blank";
        blank.textContent = "\u25A3";
        card.appendChild(blank);
      }
      const body = document.createElement("div");
      body.className = "body";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = ex.title;
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = ex.description || "";
      const open = document.createElement("span");
      open.className = "open";
      open.textContent = "Open";
      body.append(title, desc, open);
      card.appendChild(body);
      card.addEventListener("click", () => openPath(ex.file));
      cards.appendChild(card);
    }
    document.getElementById("showcase").hidden = false;
  }
  loadShowcase();
</script>
</body>
</html>
