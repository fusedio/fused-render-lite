<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<meta name="fused-app" />
<meta name="fused-api-version" content="1" />
  <title>render-app dev (iframe)</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { position: relative; background: var(--fused-bg, #111); }
    iframe { border: 0; width: 100%; height: 100%; display: block; }

    #reload, #github {
      position: fixed;
      right: 14px;
      top: 14px;
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--fused-border, rgba(255,255,255,.14));
      background: var(--fused-surface, rgba(28,28,30,.72));
      color: var(--fused-fg, #e6e6e6);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      box-shadow: 0 2px 10px rgba(0,0,0,.28);
      cursor: pointer;
      opacity: .55;
      transition: opacity .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    #github { right: 58px; text-decoration: none; }
    #reload:hover, #reload:focus-visible,
    #github:hover, #github:focus-visible {
      opacity: 1;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,.36);
      outline: none;
    }
    #reload:active, #github:active { transform: scale(.94); }
    #reload svg, #github svg { width: 16px; height: 16px; display: block; }
    #reload.spinning svg { animation: spin .6s ease-in-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <iframe id="dev" src="http://127.0.0.1:2770/" title="fused-render-app dev server"></iframe>
  <a id="github" href="https://github.com/fusedio/fused-render-lite/releases" target="_blank" rel="noopener noreferrer" title="Releases on GitHub" aria-label="Open fused-render-app releases on GitHub">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.16 1.18a11 11 0 0 1 5.76 0c2.19-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.05.78 2.12v3.14c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
    </svg>
  </a>
  <button id="reload" type="button" title="Reload (R)" aria-label="Reload dev server view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3.1-6.8" />
      <polyline points="21 3 21 9 15 9" />
    </svg>
  </button>
  <script>
    const frame = document.getElementById('dev');
    const btn = document.getElementById('reload');
    function reload() {
      btn.classList.remove('spinning');
      void btn.offsetWidth;
      btn.classList.add('spinning');
      frame.src = frame.src;
    }
    btn.addEventListener('click', reload);
    btn.addEventListener('animationend', () => btn.classList.remove('spinning'));
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey && !e.altKey) reload();
    });
  </script>
</body>
</html>
